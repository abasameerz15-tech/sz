<script>

"use strict";


/* =========================================================
   SETTINGS
========================================================= */


const OUTPUT_WIDTH = 100;

const OUTPUT_HEIGHT = 100;


/*
    الحد الأقصى للمدة المناسبة لملصق Telegram
*/

const MAX_DURATION = 3;


/*
    FPS الناتج.

    15 = حركة جيدة جدًا بالنسبة لـ100×100.
*/

const OUTPUT_FPS = 15;


/*
    جودة الفيديو.

    سيتم تعديلها تلقائيًا إذا احتجنا.
*/

const VIDEO_BITRATE = 180000;


/* =========================================================
   DOM
========================================================= */


const videoInput =
    document.getElementById(
        "videoInput"
    );


const uploadBox =
    document.getElementById(
        "uploadBox"
    );


const statusBox =
    document.getElementById(
        "statusBox"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const progressBar =
    document.getElementById(
        "progressBar"
    );


const preview =
    document.getElementById(
        "preview"
    );


const resultVideo =
    document.getElementById(
        "resultVideo"
    );


const sizeInfo =
    document.getElementById(
        "sizeInfo"
    );


const downloadButton =
    document.getElementById(
        "downloadButton"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


/* =========================================================
   CANVAS
========================================================= */


const workCanvas =
    document.createElement(
        "canvas"
    );


const workContext =
    workCanvas.getContext(
        "2d",
        {
            alpha: true
        }
    );


const outputCanvas =
    document.createElement(
        "canvas"
    );


outputCanvas.width =
    OUTPUT_WIDTH;


outputCanvas.height =
    OUTPUT_HEIGHT;


const outputContext =
    outputCanvas.getContext(
        "2d",
        {
            alpha: true
        }
    );


/* =========================================================
   MEDIAPIPE
========================================================= */


let selfieSegmentation =
    null;


let mediaPipeReady =
    false;


let segmentationBusy =
    false;


let latestSegmentation =
    null;


/* =========================================================
   STATUS
========================================================= */


function setStatus(
    text,
    percent,
    type
) {

    statusBox.style.display =
        "block";


    statusText.textContent =
        text;


    statusText.className =
        "status-text";


    if (type === "error") {

        statusText.classList.add(
            "error"
        );

    }


    if (type === "success") {

        statusText.classList.add(
            "success"
        );

    }


    if (type === "warning") {

        statusText.classList.add(
            "warning"
        );

    }


    if (
        typeof percent ===
        "number"
    ) {

        progressBar.style.width =
            Math.max(
                0,
                Math.min(
                    100,
                    percent
                )
            ) + "%";

    }

}


/* =========================================================
   SLEEP
========================================================= */


function sleep(ms) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                ms
            );

        }
    );

}


/* =========================================================
   FORMAT SIZE
========================================================= */


function formatBytes(
    bytes
) {

    if (
        bytes <
        1024
    ) {

        return (
            bytes +
            " B"
        );

    }


    if (
        bytes <
        1024 * 1024
    ) {

        return (
            (
                bytes /
                1024
            ).toFixed(1) +
            " KB"
        );

    }


    return (
        (
            bytes /
            1024 /
            1024
        ).toFixed(2) +
        " MB"
    );

}


/* =========================================================
   MEDIAPIPE INITIALIZATION
========================================================= */


async function initializeMediaPipe() {

    if (
        mediaPipeReady
    ) {

        return;

    }


    setStatus(
        "جاري تحميل محرك إزالة الخلفية...",
        3
    );


    if (
        typeof SelfieSegmentation ===
        "undefined"
    ) {

        throw new Error(
            "تعذر تحميل محرك إزالة الخلفية. تأكد من اتصال الإنترنت."
        );

    }


    selfieSegmentation =
        new SelfieSegmentation({

            locateFile:
                function(file) {

                    return (
                        "https://cdn.jsdelivr.net/npm/" +
                        "@mediapipe/selfie_segmentation@0.1/" +
                        file
                    );

                }

        });


    selfieSegmentation.setOptions({

        modelSelection: 1

    });


    /*
        مهم جدًا:

        لا نغير onResults لكل فريم.
        نخليه ثابت.
    */

    selfieSegmentation.onResults(
        function(results) {

            latestSegmentation =
                results;

            segmentationBusy =
                false;

        }
    );


    /*
        إعطاء المحرك وقتًا للتهيئة
    */

    await sleep(700);


    mediaPipeReady =
        true;


    setStatus(
        "تم تشغيل محرك إزالة الخلفية ✓",
        7,
        "success"
    );

}


/* =========================================================
   PROCESS ONE FRAME
========================================================= */


async function processFrame(
    sourceVideo
) {

    /*
        منع تشغيل أكثر من معالجة
        في نفس الوقت.
    */

    if (
        segmentationBusy
    ) {

        return false;

    }


    segmentationBusy =
        true;


    latestSegmentation =
        null;


    /*
        تصغير الصورة أثناء المعالجة
        للحفاظ على سرعة الهاتف.
    */

    const maxSide =
        256;


    const sourceWidth =
        sourceVideo.videoWidth;


    const sourceHeight =
        sourceVideo.videoHeight;


    if (
        !sourceWidth ||
        !sourceHeight
    ) {

        segmentationBusy =
            false;

        return false;

    }


    const scale =
        Math.min(
            1,
            maxSide /
            Math.max(
                sourceWidth,
                sourceHeight
            )
        );


    const width =
        Math.max(
            2,
            Math.round(
                sourceWidth *
                scale
            )
        );


    const height =
        Math.max(
            2,
            Math.round(
                sourceHeight *
                scale
            )
        );


    workCanvas.width =
        width;


    workCanvas.height =
        height;


    /*
        رسم الفريم الأصلي
    */

    workContext.clearRect(
        0,
        0,
        width,
        height
    );


    workContext.drawImage(
        sourceVideo,
        0,
        0,
        width,
        height
    );


    /*
        إرسال الفريم إلى MediaPipe
    */

    try {

        await selfieSegmentation.send({
            image: workCanvas
        });

    } catch(error) {

        segmentationBusy =
            false;

        throw error;

    }


    /*
        انتظار نتيجة القناع
    */

    const start =
        performance.now();


    while (
        !latestSegmentation
    ) {

        if (
            performance.now() -
            start >
            7000
        ) {

            segmentationBusy =
                false;

            throw new Error(
                "محرك إزالة الخلفية لم يستجب."
            );

        }


        await sleep(5);

    }


    const result =
        latestSegmentation;


    /*
        إعادة رسم الصورة الأصلية
    */

    workContext.globalCompositeOperation =
        "source-over";


    workContext.clearRect(
        0,
        0,
        width,
        height
    );


    workContext.drawImage(
        sourceVideo,
        0,
        0,
        width,
        height
    );


    /*
        تطبيق الشفافية حسب القناع
    */

    workContext.globalCompositeOperation =
        "destination-in";


    workContext.drawImage(
        result.segmentationMask,
        0,
        0,
        width,
        height
    );


    workContext.globalCompositeOperation =
        "source-over";


    /*
        تجهيز Canvas 100×100
    */

    outputContext.clearRect(
        0,
        0,
        OUTPUT_WIDTH,
        OUTPUT_HEIGHT
    );


    /*
        نحافظ على نسبة أبعاد الفيديو
        ولا نقص الشخصية.
    */

    const scaleOut =
        Math.min(
            OUTPUT_WIDTH / width,
            OUTPUT_HEIGHT / height
        );


    const outputWidth =
        width *
        scaleOut;


    const outputHeight =
        height *
        scaleOut;


    const x =
        (
            OUTPUT_WIDTH -
            outputWidth
        ) / 2;


    const y =
        (
            OUTPUT_HEIGHT -
            outputHeight
        ) / 2;


    outputContext.drawImage(
        workCanvas,
        0,
        0,
        width,
        height,
        x,
        y,
        outputWidth,
        outputHeight
    );


    segmentationBusy =
        false;


    return true;

}


/* =========================================================
   LOAD SOURCE VIDEO
========================================================= */


function loadSourceVideo(
    file
) {

    return new Promise(
        function(resolve, reject) {

            const video =
                document.createElement(
                    "video"
                );


            const url =
                URL.createObjectURL(
                    file
                );


            video.src =
                url;


            video.muted =
                true;


            video.playsInline =
                true;


            video.setAttribute(
                "playsinline",
                ""
            );


            video.preload =
                "auto";


            /*
                نخليه داخل الصفحة بشكل
                غير مرئي بدل display:none
                لأن بعض المتصفحات تتعامل
                أفضل معه بهذه الطريقة.
            */

            video.style.position =
                "fixed";


            video.style.width =
                "1px";


            video.style.height =
                "1px";


            video.style.opacity =
                "0";


            video.style.pointerEvents =
                "none";


            video.style.left =
                "-10px";


            video.style.top =
                "-10px";


            document.body.appendChild(
                video
            );


            video.onloadedmetadata =
                function() {

                    resolve({
                        video: video,
                        url: url
                    });

                };


            video.onerror =
                function() {

                    URL.revokeObjectURL(
                        url
                    );


                    if (
                        video.parentNode
                    ) {

                        video.parentNode.removeChild(
                            video
                        );

                    }


                    reject(
                        new Error(
                            "تعذر قراءة الفيديو."
                        )
                    );

                };

        }
    );

}


/* =========================================================
   CHECK MEDIARECORDER
========================================================= */


function getSupportedMime() {

    if (
        typeof MediaRecorder ===
        "undefined"
    ) {

        throw new Error(
            "متصفحك لا يدعم MediaRecorder."
        );

    }


    const types = [

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp09",

        "video/webm;codecs=vp8",

        "video/webm"

    ];


    for (
        const type of types
    ) {

        try {

            if (
                MediaRecorder.isTypeSupported(
                    type
                )
            ) {

                return type;

            }

        } catch {}

    }


    throw new Error(
        "المتصفح لا يدعم إخراج WebM."
    );

}


/* =========================================================
   CREATE STREAM
========================================================= */


function createCanvasStream() {

    if (
        !outputCanvas.captureStream
    ) {

        throw new Error(
            "متصفحك لا يدعم Canvas Video."
        );

    }


    return outputCanvas.captureStream(
        OUTPUT_FPS
    );

}


/* =========================================================
   RECORD VIDEO
========================================================= */


async function recordProcessedVideo(
    sourceVideo,
    duration
) {

    const mimeType =
        getSupportedMime();


    const stream =
        createCanvasStream();


    const chunks = [];


    let recorder;


    try {

        recorder =
            new MediaRecorder(
                stream,
                {

                    mimeType:

                        mimeType,

                    videoBitsPerSecond:

                        VIDEO_BITRATE

                }
            );

    } catch(error) {

        stream.getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        throw new Error(
            "تعذر تشغيل مسجل WebM."
        );

    }


    const recorderFinished =
        new Promise(
            function(resolve, reject) {

                recorder.ondataavailable =
                    function(event) {

                        if (
                            event.data &&
                            event.data.size >
                            0
                        ) {

                            chunks.push(
                                event.data
                            );

                        }

                    };


                recorder.onerror =
                    function(event) {

                        reject(
                            event.error ||
                            new Error(
                                "حدث خطأ أثناء تسجيل الفيديو."
                            )
                        );

                    };


                recorder.onstop =
                    function() {

                        resolve();

                    };

            }
        );


    /*
        بدء التسجيل
    */

    recorder.start(
        250
    );


    /*
        إعادة الفيديو للبداية
    */

    sourceVideo.currentTime =
        0;


    await sleep(150);


    /*
        نستخدم requestVideoFrameCallback
        عندما يكون متوفرًا.
    */

    let lastOutputTime =
        -1;


    let frameCount =
        0;


    let processing =
        false;


    /*
        Promise لمعرفة انتهاء الفيديو
    */

    const playbackFinished =
        new Promise(
            async function(resolve) {

                let ended =
                    false;


                function finish() {

                    if (
                        ended
                    ) {

                        return;

                    }


                    ended =
                        true;


                    resolve();

                }


                sourceVideo.onended =
                    finish;


                /*
                    بعض المتصفحات قد لا تطلق
                    ended بطريقة متوقعة.
                */

                const safetyTimer =
                    setTimeout(
                        finish,
                        (
                            duration +
                            2
                        ) * 1000
                    );


                /*
                    تشغيل الفيديو
                */

                try {

                    await sourceVideo.play();

                } catch(error) {

                    clearTimeout(
                        safetyTimer
                    );

                    finish();

                    throw new Error(
                        "المتصفح منع تشغيل الفيديو. اضغط رفع الفيديو مرة أخرى."
                    );

                }


                /*
                    حلقة معالجة الفريمات
                */

                const processLoop =
                    async function() {

                        if (
                            ended
                        ) {

                            return;

                        }


                        const currentTime =
                            sourceVideo.currentTime;


                        /*
                            نأخذ فقط FPS المطلوب
                        */

                        const interval =
                            1 /
                            OUTPUT_FPS;


                        if (
                            !processing &&
                            (
                                lastOutputTime <
                                0 ||
                                currentTime -
                                lastOutputTime >=
                                interval * .8
                            )
                        ) {

                            processing =
                                true;


                            try {

                                await processFrame(
                                    sourceVideo
                                );


                                lastOutputTime =
                                    currentTime;


                                frameCount++;


                                const percent =
                                    10 +
                                    (
                                        currentTime /
                                        duration
                                    ) * 80;


                                setStatus(
                                    "جاري إزالة الخلفية... " +
                                    Math.round(
                                        Math.min(
                                            90,
                                            percent
                                        )
                                    ) +
                                    "%",
                                    percent
                                );


                            } catch(error) {

                                clearTimeout(
                                    safetyTimer
                                );

                                ended =
                                    true;


                                resolve();


                                throw error;

                            }


                            processing =
                                false;

                        }


                        if (
                            !ended
                        ) {

                            if (
                                typeof sourceVideo
                                    .requestVideoFrameCallback ===
                                "function"
                            ) {

                                sourceVideo.requestVideoFrameCallback(
                                    function() {

                                        processLoop();

                                    }
                                );

                            } else {

                                setTimeout(
                                    processLoop,
                                    20
                                );

                            }

                        }

                    };


                processLoop();

            }
        );


    /*
        انتظار انتهاء الفيديو
    */

    await playbackFinished;


    /*
        إعطاء آخر فريم وقتًا للتسجيل
    */

    await sleep(500);


    /*
        إيقاف التسجيل
    */

    if (
        recorder.state !==
        "inactive"
    ) {

        recorder.stop();

    }


    /*
        انتظار MediaRecorder
    */

    await Promise.race([

        recorderFinished,

        new Promise(
            function(_, reject) {

                setTimeout(
                    function() {

                        reject(
                            new Error(
                                "مسجل WebM لم ينتهِ في الوقت المتوقع."
                            )
                        );

                    },
                    12000
                );

            }
        )

    ]);


    /*
        تنظيف
    */

    stream.getTracks()
        .forEach(
            function(track) {

                track.stop();

            }
        );


    if (
        !chunks.length
    ) {

        throw new Error(
            "لم يتم إنشاء أي بيانات WebM."
        );

    }


    return new Blob(
        chunks,
        {
            type: mimeType
        }
    );

}


/* =========================================================
   MAIN PROCESS
========================================================= */


async function processVideo(
    file
) {

    let source =
        null;


    try {

        /*
            فحص الملف
        */

        if (!file) {

            return;

        }


        if (
            !file.type.startsWith(
                "video/"
            )
        ) {

            throw new Error(
                "الملف الذي اخترته ليس فيديو."
            );

        }


        /*
            تجهيز الواجهة
        */

        uploadBox.style.pointerEvents =
            "none";


        downloadButton.style.display =
            "none";


        resetButton.style.display =
            "none";


        preview.style.display =
            "none";


        progressBar.style.width =
            "0%";


        /*
            تشغيل MediaPipe
        */

        await initializeMediaPipe();


        /*
            تحميل الفيديو
        */

        setStatus(
            "جاري قراءة الفيديو...",
            8
        );


        source =
            await loadSourceVideo(
                file
            );


        const video =
            source.video;


        const duration =
            video.duration;


        /*
            Telegram Sticker Video
            يجب ألا يتجاوز 3 ثوانٍ
        */

        if (
            !Number.isFinite(
                duration
            ) ||
            duration <= 0
        ) {

            throw new Error(
                "تعذر معرفة مدة الفيديو."
            );

        }


        if (
            duration >
            MAX_DURATION
        ) {

            throw new Error(
                "الفيديو أطول من 3 ثوانٍ. قص الفيديو إلى 3 ثوانٍ أو أقل ثم ارفعه."
            );

        }


        /*
            تشغيل أول فريم
            للتأكد أن الفيديو صالح
        */

        setStatus(
            "جاري تجهيز الفيديو...",
            10
        );


        video.currentTime =
            0;


        await sleep(200);


        /*
            تنظيف Canvas
        */

        outputContext.clearRect(
            0,
            0,
            OUTPUT_WIDTH,
            OUTPUT_HEIGHT
        );


        /*
            تسجيل الفيديو
        */

        const resultBlob =
            await recordProcessedVideo(
                video,
                duration
            );


        /*
            التحقق من الملف
        */

        if (
            !resultBlob ||
            resultBlob.size === 0
        ) {

            throw new Error(
                "فشل إنشاء الفيديو النهائي."
            );

        }


        /*
            إنشاء رابط المعاينة
        */

        const resultURL =
            URL.createObjectURL(
                resultBlob
            );


        resultVideo.src =
            resultURL;


        /*
            إظهار المعاينة
        */

        preview.style.display =
            "block";


        sizeInfo.textContent =
            formatBytes(
                resultBlob.size
            );


        /*
            زر التحميل
        */

        downloadButton.style.display =
            "block";


        downloadButton.onclick =
            function() {

                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    resultURL;


                link.download =
                    "SZ_Sticker.webm";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();

            };


        /*
            النجاح
        */

        setStatus(
            "✅ تم تجهيز الفيديو بالكامل — اضغط تحميل",
            100,
            "success"
        );


        resetButton.style.display =
            "block";


    } catch(error) {

        console.error(
            "PROCESS ERROR:",
            error
        );


        setStatus(
            "❌ " +
            (
                error.message ||
                "حدث خطأ غير معروف."
            ),
            0,
            "error"
        );


        resetButton.style.display =
            "block";


    } finally {

        /*
            تنظيف الفيديو الأصلي
        */

        if (
            source &&
            source.video
        ) {

            try {

                source.video.pause();

            } catch {}


            try {

                if (
                    source.video.parentNode
                ) {

                    source.video.parentNode.removeChild(
                        source.video
                    );

                }

            } catch {}


            try {

                URL.revokeObjectURL(
                    source.url
                );

            } catch {}

        }


        uploadBox.style.pointerEvents =
            "auto";

    }

}


/* =========================================================
   FILE INPUT
========================================================= */


videoInput.addEventListener(
    "change",
    async function() {

        const file =
            this.files &&
            this.files[0];


        if (!file) {

            return;

        }


        await processVideo(
            file
        );

    }
);


/* =========================================================
   RESET
========================================================= */


resetButton.addEventListener(
    "click",
    function() {

        /*
            إلغاء رابط المعاينة
        */

        if (
            resultVideo.src
        ) {

            try {

                URL.revokeObjectURL(
                    resultVideo.src
                );

            } catch {}

        }


        resultVideo.removeAttribute(
            "src"
        );


        resultVideo.load();


        preview.style.display =
            "none";


        downloadButton.style.display =
            "none";


        resetButton.style.display =
            "none";


        statusBox.style.display =
            "none";


        progressBar.style.width =
            "0%";


        videoInput.value =
            "";

    }
);


/* =========================================================
   INITIAL CHECK
========================================================= */


window.addEventListener(
    "load",
    function() {

        console.log(
            "SZ Video Sticker Maker Ready"
        );


        /*
            فحص دعم المتصفح
        */

        if (
            typeof MediaRecorder ===
            "undefined"
        ) {

            setStatus(
                "⚠️ هذا المتصفح لا يدعم إنشاء WebM.",
                0,
                "error"
            );

        }

    }
);
