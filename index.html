<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>إزالة خلفية الفيديو</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/selfie_segmentation.js"></script>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:#080808;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px;
}

.app{
    width:100%;
    max-width:520px;
    background:#111;
    border:1px solid #292929;
    border-radius:24px;
    padding:22px;
    box-shadow:0 20px 70px #000;
}

h1{
    text-align:center;
    margin:4px 0 8px;
    font-size:25px;
}

.sub{
    text-align:center;
    color:#999;
    font-size:14px;
    margin-bottom:20px;
}

.upload{
    border:2px dashed #444;
    border-radius:18px;
    padding:28px 15px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.upload:hover{
    border-color:#777;
    background:#151515;
}

.upload strong{
    display:block;
    font-size:18px;
    margin-bottom:7px;
}

.upload span{
    color:#888;
    font-size:13px;
}

input[type=file]{
    display:none;
}

.previewBox{
    display:none;
    margin-top:18px;
    background:#080808;
    border-radius:18px;
    padding:12px;
}

video{
    width:100%;
    max-height:330px;
    border-radius:12px;
    background:#000;
    display:block;
}

.info{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.info div{
    background:#181818;
    border-radius:10px;
    padding:10px;
    text-align:center;
    font-size:12px;
    color:#aaa;
}

.info b{
    display:block;
    color:#fff;
    margin-top:4px;
}

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    margin-top:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:#fff;
    color:#000;
}

button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.progress{
    display:none;
    margin-top:16px;
}

.progressText{
    display:flex;
    justify-content:space-between;
    color:#aaa;
    font-size:13px;
    margin-bottom:7px;
}

.bar{
    height:8px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

.barInner{
    width:0%;
    height:100%;
    background:#fff;
    transition:.1s;
}

.status{
    text-align:center;
    margin-top:12px;
    color:#aaa;
    font-size:13px;
    min-height:20px;
}

.output{
    display:none;
    margin-top:18px;
    background:#151515;
    border-radius:18px;
    padding:14px;
}

.output canvas{
    width:180px;
    height:180px;
    display:block;
    margin:auto;
    border-radius:12px;
    background:
      linear-gradient(45deg,#333 25%,transparent 25%),
      linear-gradient(-45deg,#333 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#333 75%),
      linear-gradient(-45deg,transparent 75%,#333 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0;
}

.download{
    background:#fff;
}

.note{
    margin-top:15px;
    text-align:center;
    color:#666;
    font-size:11px;
    line-height:1.7;
}
</style>
</head>

<body>

<div class="app">

    <h1>إزالة خلفية الفيديو</h1>

    <div class="sub">
        يحافظ على مدة وحركة الفيديو قدر الإمكان
    </div>

    <label class="upload" for="file">
        <strong>📁 اختر فيديو</strong>
        <span>MP4 / WebM / MOV</span>
    </label>

    <input id="file" type="file" accept="video/*">

    <div class="previewBox" id="previewBox">

        <video id="video"
               playsinline
               muted
               controls></video>

        <div class="info">
            <div>
                المدة
                <b id="duration">--</b>
            </div>

            <div>
                الدقة
                <b id="resolution">--</b>
            </div>
        </div>

        <button id="startBtn">
            إزالة الخلفية
        </button>

    </div>

    <div class="progress" id="progress">

        <div class="progressText">
            <span id="status">جاري المعالجة...</span>
            <span id="percent">0%</span>
        </div>

        <div class="bar">
            <div class="barInner" id="barInner"></div>
        </div>

    </div>

    <div class="output" id="output">

        <canvas id="previewCanvas"
                width="100"
                height="100"></canvas>

        <button class="download" id="downloadBtn">
            ⬇️ تحميل WebM شفاف
        </button>

    </div>

    <div class="status" id="mainStatus"></div>

    <div class="note">
        تتم المعالجة داخل المتصفح ولا يتم رفع الفيديو إلى سيرفر.
    </div>

</div>


<script>

const fileInput = document.getElementById("file");
const video = document.getElementById("video");
const previewBox = document.getElementById("previewBox");
const startBtn = document.getElementById("startBtn");

const durationEl = document.getElementById("duration");
const resolutionEl = document.getElementById("resolution");

const progress = document.getElementById("progress");
const statusEl = document.getElementById("status");
const percentEl = document.getElementById("percent");
const barInner = document.getElementById("barInner");

const output = document.getElementById("output");
const previewCanvas = document.getElementById("previewCanvas");
const downloadBtn = document.getElementById("downloadBtn");
const mainStatus = document.getElementById("mainStatus");


let fileURL = null;
let outputBlob = null;

let sourceFPS = 30;

let segmentationReady = false;
let processing = false;
let recorder = null;
let chunks = [];

let lastResult = null;


/* =========================
   CANVAS
========================= */

const inputCanvas = document.createElement("canvas");
const inputCtx = inputCanvas.getContext("2d", {
    willReadFrequently:false
});

const canvas = document.createElement("canvas");
canvas.width = 100;
canvas.height = 100;

const ctx = canvas.getContext("2d", {
    alpha:true,
    willReadFrequently:false
});


/* =========================
   MEDIA PIPE
========================= */

const selfieSegmentation = new SelfieSegmentation({

    locateFile: function(file){

        return "https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/" + file;

    }

});

selfieSegmentation.setOptions({
    modelSelection:1
});


/*
   يتم استدعاؤها بعد انتهاء معالجة الفريم
*/
selfieSegmentation.onResults(function(results){

    if(!processing){
        return;
    }

    drawTransparent(results);

});


segmentationReady = true;


/* =========================
   DRAW TRANSPARENT FRAME
========================= */

function drawTransparent(results){

    ctx.clearRect(0,0,100,100);

    /*
       رسم الصورة بحجم يحافظ على كامل الفيديو
       بدون تمديد الشخصية
    */

    const sw = inputCanvas.width;
    const sh = inputCanvas.height;

    const scale = Math.min(
        100 / sw,
        100 / sh
    );

    const dw = sw * scale;
    const dh = sh * scale;

    const dx = (100 - dw) / 2;
    const dy = (100 - dh) / 2;


    /*
       أولاً نرسم الصورة
    */

    ctx.save();

    ctx.drawImage(
        results.image,
        dx,
        dy,
        dw,
        dh
    );

    ctx.globalCompositeOperation = "destination-in";

    /*
       قناع الشخص
    */

    ctx.drawImage(
        results.segmentationMask,
        dx,
        dy,
        dw,
        dh
    );

    ctx.restore();

}


/* =========================
   FILE
========================= */

fileInput.addEventListener("change", async function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    if(!file.type.startsWith("video/")){
        alert("اختر ملف فيديو.");
        return;
    }

    if(fileURL){
        URL.revokeObjectURL(fileURL);
    }

    fileURL = URL.createObjectURL(file);

    video.src = fileURL;

    previewBox.style.display = "block";
    output.style.display = "none";

    mainStatus.textContent = "جاري تجهيز الفيديو...";

    await waitVideoMetadata();

    durationEl.textContent =
        formatTime(video.duration);

    resolutionEl.textContent =
        video.videoWidth + " × " + video.videoHeight;

    mainStatus.textContent = "";

});


function waitVideoMetadata(){

    return new Promise(resolve => {

        if(video.readyState >= 1){

            resolve();
            return;

        }

        video.addEventListener(
            "loadedmetadata",
            resolve,
            {once:true}
        );

    });

}


/* =========================
   FPS ESTIMATION
========================= */

async function estimateFPS(){

    /*
       بعض المتصفحات لا توفر FPS الأصلي
       لذلك نحاول حسابه من mediaTime
    */

    if(!("requestVideoFrameCallback" in HTMLVideoElement.prototype)){

        return 30;

    }


    return new Promise(async resolve => {

        const times = [];

        let lastTime = null;

        let startWall = performance.now();


        function callback(now, metadata){

            if(lastTime !== null){

                const diff =
                    metadata.mediaTime - lastTime;

                if(diff > 0 && diff < 1){

                    times.push(diff);

                }

            }

            lastTime = metadata.mediaTime;


            if(
                times.length >= 20 ||
                performance.now() - startWall > 1000
            ){

                let fps = 30;

                if(times.length > 3){

                    const sorted = [...times].sort(
                        (a,b)=>a-b
                    );

                    const median =
                        sorted[
                            Math.floor(sorted.length/2)
                        ];

                    if(median > 0){

                        fps = 1 / median;

                    }

                }

                fps = Math.round(
                    Math.max(1,Math.min(60,fps))
                );

                resolve(fps);

                return;

            }

            video.requestVideoFrameCallback(callback);

        }


        video.currentTime = 0;

        video.play().then(()=>{

            video.requestVideoFrameCallback(callback);

        }).catch(()=>{

            resolve(30);

        });


    }).finally(()=>{

        video.pause();

        try{
            video.currentTime = 0;
        }catch(e){}

    });

}


/* =========================
   START
========================= */

startBtn.addEventListener("click", async function(){

    if(processing){
        return;
    }

    if(!video.duration){
        alert("الفيديو غير جاهز.");
        return;
    }

    if(video.duration > 3.0){

        alert(
            "الفيديو أطول من 3 ثوانٍ.\n\n" +
            "Telegram Video Stickers / Custom Emoji لها حد أقصى 3 ثوانٍ."
        );

        return;
    }


    processing = true;

    startBtn.disabled = true;

    progress.style.display = "block";

    output.style.display = "none";

    statusEl.textContent =
        "جاري معرفة معدل الإطارات...";

    percentEl.textContent = "0%";

    barInner.style.width = "0%";


    try{

        /*
           نحاول معرفة FPS الحقيقي
        */

        sourceFPS = await estimateFPS();


        statusEl.textContent =
            "FPS: " + sourceFPS +
            " — جاري إزالة الخلفية...";


        /*
           حجم المعالجة الداخلي يكون بدقة الفيديو
           ثم نخفضه فقط في الإخراج النهائي.
        */

        inputCanvas.width =
            video.videoWidth;

        inputCanvas.height =
            video.videoHeight;


        /*
           نستخدم captureStream بنفس FPS المصدر
        */

        const stream =
            canvas.captureStream(sourceFPS);


        /*
           Telegram يحتاج VP9
        */

        let mimeType = "";

        const possibleTypes = [

            "video/webm;codecs=vp9",

            "video/webm;codecs=vp09"

        ];


        for(const type of possibleTypes){

            if(
                MediaRecorder.isTypeSupported(type)
            ){

                mimeType = type;
                break;

            }

        }


        if(!mimeType){

            throw new Error(
                "المتصفح لا يدعم WebM VP9."
            );

        }


        /*
           bitrate مناسب لفيديو 100×100
        */

        const duration =
            Math.max(0.1,video.duration);

        let bitrate =
            Math.round(
                (230 * 1024 * 8) / duration
            );

        bitrate =
            Math.max(
                250000,
                Math.min(
                    900000,
                    bitrate
                )
            );


        recorder = new MediaRecorder(
            stream,
            {
                mimeType:mimeType,
                videoBitsPerSecond:bitrate
            }
        );


        chunks = [];


        recorder.ondataavailable = function(e){

            if(e.data && e.data.size){

                chunks.push(e.data);

            }

        };


        const recorderStopped =
            new Promise(resolve => {

                recorder.onstop = resolve;

            });


        recorder.start(100);


        /*
           بداية الفيديو
        */

        video.currentTime = 0;


        /*
           معالجة الفيديو باستخدام
           requestVideoFrameCallback
           بدلاً من seek لكل فريم.
        */

        await processVideo();


        /*
           إيقاف التسجيل
        */

        recorder.stop();

        await recorderStopped;


        outputBlob = new Blob(
            chunks,
            {
                type:mimeType
            }
        );


        /*
           عرض آخر فريم
        */

        ctx.clearRect(0,0,100,100);

        if(lastResult){

            drawTransparent(lastResult);

        }


        output.style.display = "block";


        statusEl.textContent =
            "تم الانتهاء ✅";


        percentEl.textContent =
            "100%";

        barInner.style.width =
            "100%";


        mainStatus.textContent =
            "تم إنشاء الفيديو الشفاف بنجاح";


    }catch(error){

        console.error(error);

        if(
            recorder &&
            recorder.state === "recording"
        ){

            recorder.stop();

        }


        statusEl.textContent =
            "حدث خطأ ❌";

        mainStatus.textContent =
            error.message ||
            "تعذر معالجة الفيديو.";

    }


    processing = false;

    startBtn.disabled = false;

});


/* =========================
   PROCESS VIDEO
========================= */

async function processVideo(){

    return new Promise(async resolve => {

        let finished = false;


        function finish(){

            if(finished){
                return;
            }

            finished = true;

            video.pause();

            resolve();

        }


        /*
           كل فريم يصل من الفيديو
        */

        async function frameCallback(
            now,
            metadata
        ){

            if(finished){
                return;
            }


            /*
               نهاية الفيديو
            */

            if(
                metadata.mediaTime >=
                video.duration - 0.001
            ){

                /*
                   معالجة آخر فريم
                */

                await processCurrentFrame();


                updateProgress(
                    video.duration
                );


                finish();

                return;

            }


            await processCurrentFrame();


            updateProgress(
                metadata.mediaTime
            );


            if(!finished){

                video.requestVideoFrameCallback(
                    frameCallback
                );

            }

        }


        video.addEventListener(
            "ended",
            finish,
            {once:true}
        );


        /*
           بدء التشغيل
        */

        try{

            await video.play();

            video.requestVideoFrameCallback(
                frameCallback
            );

        }catch(error){

            console.error(error);

            finish();

        }

    });

}


/* =========================
   PROCESS CURRENT FRAME
========================= */

async function processCurrentFrame(){

    /*
       نسخ فريم الفيديو إلى Canvas
    */

    inputCtx.clearRect(
        0,
        0,
        inputCanvas.width,
        inputCanvas.height
    );


    inputCtx.drawImage(
        video,
        0,
        0,
        inputCanvas.width,
        inputCanvas.height
    );


    /*
       MediaPipe
    */

    await selfieSegmentation.send({
        image:inputCanvas
    });

}


/* =========================
   PROGRESS
========================= */

function updateProgress(time){

    if(!video.duration){
        return;
    }

    let p =
        Math.min(
            100,
            Math.max(
                0,
                (time / video.duration) * 100
            )
        );


    percentEl.textContent =
        Math.round(p) + "%";

    barInner.style.width =
        p + "%";


    statusEl.textContent =
        "جاري إزالة الخلفية... " +
        Math.round(p) +
        "%";

}


/* =========================
   DOWNLOAD
========================= */

downloadBtn.addEventListener(
    "click",
    function(){

        if(!outputBlob){
            return;
        }


        const url =
            URL.createObjectURL(outputBlob);


        const a =
            document.createElement("a");

        a.href = url;

        a.download =
            "SZ_Transparent_Video.webm";


        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(
            ()=>URL.revokeObjectURL(url),
            2000
        );

    }
);


/* =========================
   TIME
========================= */

function formatTime(seconds){

    if(!isFinite(seconds)){
        return "--";
    }

    const m =
        Math.floor(seconds / 60);

    const s =
        Math.floor(seconds % 60);

    return (
        String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0")
    );

}

</script>

</body>
</html>
