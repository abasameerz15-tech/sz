<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SZ Video Cleaner</title>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#25203d 0%,#0d0d14 42%,#07070b 100%);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:520px;
}

.card{
    background:rgba(18,18,28,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px;
    padding:24px;
    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter:blur(20px);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#9b6cff;
}

.subtitle{
    text-align:center;
    color:#9b9baa;
    font-size:13px;
    margin-top:8px;
    margin-bottom:22px;
}

.upload{
    width:100%;
    min-height:170px;
    border:2px dashed rgba(155,108,255,.45);
    border-radius:22px;
    background:rgba(155,108,255,.055);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.25s;
}

.upload:hover{
    background:rgba(155,108,255,.11);
    border-color:#9b6cff;
    transform:translateY(-2px);
}

.upload-icon{
    width:65px;
    height:65px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#9b6cff,#6240c9);
    font-size:28px;
    margin-bottom:13px;
    box-shadow:0 10px 35px rgba(125,80,255,.3);
}

.upload-title{
    font-size:17px;
    font-weight:bold;
}

.upload-info{
    color:#888895;
    font-size:12px;
    margin-top:6px;
}

input[type=file]{
    display:none;
}

.status{
    display:none;
    margin-top:18px;
    background:rgba(255,255,255,.045);
    border-radius:16px;
    padding:14px;
}

.status-text{
    font-size:13px;
    color:#d6d6df;
    margin-bottom:10px;
}

.progress{
    height:7px;
    width:100%;
    background:#242431;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#7244ff,#b18cff);
    border-radius:20px;
    transition:.2s;
}

.preview{
    display:none;
    margin-top:20px;
}

.preview-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:10px;
}

.video-box{
    position:relative;
    width:100%;
    min-height:250px;
    border-radius:20px;
    overflow:hidden;

    background-color:#15151e;

    background-image:
        linear-gradient(45deg,#252532 25%,transparent 25%),
        linear-gradient(-45deg,#252532 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#252532 75%),
        linear-gradient(-45deg,transparent 75%,#252532 75%);

    background-size:24px 24px;
    background-position:0 0,0 12px,12px -12px,-12px 0;

    display:flex;
    align-items:center;
    justify-content:center;
}

#resultVideo{
    width:100%;
    max-height:360px;
    object-fit:contain;
}

.info{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-top:10px;
}

.info-box{
    flex:1;
    background:rgba(255,255,255,.045);
    border-radius:13px;
    padding:10px;
    text-align:center;
}

.info-label{
    color:#777786;
    font-size:10px;
}

.info-value{
    margin-top:4px;
    font-size:12px;
    font-weight:bold;
}

.download{
    width:100%;
    border:0;
    border-radius:16px;
    padding:15px;
    margin-top:13px;

    background:linear-gradient(135deg,#9b6cff,#6842d5);
    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 12px 30px rgba(105,65,220,.25);
    transition:.2s;
}

.download:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
}

.download:active{
    transform:scale(.98);
}

.error{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:14px;
    background:rgba(255,60,80,.09);
    border:1px solid rgba(255,60,80,.15);
    color:#ff9ca7;
    font-size:12px;
    line-height:1.6;
}

.note{
    text-align:center;
    margin-top:16px;
    color:#656572;
    font-size:10px;
    line-height:1.6;
}

.hidden-video,
#workCanvas{
    display:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            SZ <span>Video Cleaner</span>
        </div>

        <div class="subtitle">
            إزالة الخلفية وتحويل الفيديو تلقائيًا إلى WebM
        </div>

        <label class="upload" for="videoInput">

            <div class="upload-icon">
                ↑
            </div>

            <div class="upload-title">
                اضغط لرفع الفيديو
            </div>

            <div class="upload-info">
                WebM / MP4 / MOV
            </div>

        </label>

        <input
            id="videoInput"
            type="file"
            accept="video/*"
        >

        <div class="status" id="status">

            <div class="status-text" id="statusText">
                جاري تجهيز الفيديو...
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

        </div>

        <div class="error" id="error"></div>

        <div class="preview" id="preview">

            <div class="preview-title">
                النتيجة النهائية
            </div>

            <div class="video-box">

                <video
                    id="resultVideo"
                    controls
                    playsinline
                    loop
                ></video>

            </div>

            <div class="info">

                <div class="info-box">
                    <div class="info-label">
                        المقاس
                    </div>

                    <div class="info-value">
                        100 × 100
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-label">
                        الصيغة
                    </div>

                    <div class="info-value">
                        WebM
                    </div>
                </div>

                <div class="info-box">
                    <div class="info-label">
                        الحجم
                    </div>

                    <div class="info-value" id="fileSize">
                        --
                    </div>
                </div>

            </div>

            <button
                class="download"
                id="downloadBtn"
            >
                تحميل الفيديو
            </button>

        </div>

        <div class="note">
            تتم المعالجة داخل المتصفح قدر الإمكان، ولا يتم رفع الفيديو
            إلى سيرفر من هذا الكود.
        </div>

    </div>

</div>


<video
    id="sourceVideo"
    class="hidden-video"
    muted
    playsinline
></video>

<canvas
    id="workCanvas"
    width="100"
    height="100"
></canvas>


<script>

const videoInput = document.getElementById("videoInput");
const sourceVideo = document.getElementById("sourceVideo");
const resultVideo = document.getElementById("resultVideo");

const canvas = document.getElementById("workCanvas");
const ctx = canvas.getContext("2d", {
    alpha:true,
    willReadFrequently:false
});

const statusBox = document.getElementById("status");
const statusText = document.getElementById("statusText");
const progressBar = document.getElementById("progressBar");

const preview = document.getElementById("preview");
const errorBox = document.getElementById("error");

const fileSize = document.getElementById("fileSize");
const downloadBtn = document.getElementById("downloadBtn");

let finalBlob = null;
let finalURL = null;


/* =========================
   إعداد إزالة الخلفية
========================= */

const selfieSegmentation = new SelfieSegmentation({
    locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
    }
});

selfieSegmentation.setOptions({
    modelSelection: 1
});


/* =========================
   تغيير الحالة
========================= */

function setStatus(text, percent){

    statusBox.style.display = "block";

    statusText.textContent = text;

    progressBar.style.width =
        Math.max(0,Math.min(100,percent)) + "%";
}


/* =========================
   الأخطاء
========================= */

function showError(message){

    errorBox.style.display = "block";
    errorBox.textContent = message;

}

function hideError(){

    errorBox.style.display = "none";
}


/* =========================
   تحويل الحجم
========================= */

function formatBytes(bytes){

    if(bytes < 1024){
        return bytes + " B";
    }

    if(bytes < 1024 * 1024){
        return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / 1024 / 1024).toFixed(2) + " MB";
}


/* =========================
   حساب مكان الفيديو
========================= */

function drawCover(video){

    const vw = video.videoWidth;
    const vh = video.videoHeight;

    const size = Math.min(vw,vh);

    const sx = (vw - size) / 2;
    const sy = (vh - size) / 2;

    ctx.clearRect(0,0,100,100);

    ctx.drawImage(
        video,
        sx,
        sy,
        size,
        size,
        0,
        0,
        100,
        100
    );
}


/* =========================
   حفظ نسخة النتيجة
========================= */

let lastSegmentation = null;

selfieSegmentation.onResults((results) => {

    lastSegmentation = results;

});


/* =========================
   معالجة فريم
========================= */

async function processFrame(){

    drawCover(sourceVideo);

    await selfieSegmentation.send({
        image:canvas
    });

    if(!lastSegmentation || !lastSegmentation.segmentationMask){
        return;
    }

    const mask = lastSegmentation.segmentationMask;

    /*
       نحصل على الماسك من MediaPipe
       ثم نطبقه على الـ Canvas
    */

    const temp = document.createElement("canvas");

    temp.width = 100;
    temp.height = 100;

    const tctx = temp.getContext("2d");

    tctx.drawImage(
        mask,
        0,
        0,
        100,
        100
    );

    const image = ctx.getImageData(
        0,
        0,
        100,
        100
    );

    const maskData = tctx.getImageData(
        0,
        0,
        100,
        100
    );

    for(let i=0;i<image.data.length;i+=4){

        const alpha = maskData.data[i];

        /*
           تنعيم حواف الشخصية
        */

        if(alpha < 70){

            image.data[i+3] = 0;

        }else{

            image.data[i+3] =
                Math.min(
                    255,
                    Math.max(
                        0,
                        (alpha - 30) * 1.25
                    )
                );

        }

    }

    ctx.putImageData(image,0,0);
}


/* =========================
   اختيار نوع WebM
========================= */

function getMimeType(){

    const types = [

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp8",

        "video/webm"

    ];

    for(const type of types){

        if(
            MediaRecorder.isTypeSupported(type)
        ){

            return type;

        }

    }

    return "";

}


/* =========================
   تسجيل Canvas
========================= */

async function recordVideo(){

    const mime = getMimeType();

    if(!mime){

        throw new Error(
            "المتصفح لا يدعم إنشاء WebM."
        );

    }

    /*
       نستخدم 100x100
       مع FPS منخفض حتى نقدر نوصل لحجم صغير.
    */

    const stream = canvas.captureStream(8);

    const chunks = [];

    const recorder = new MediaRecorder(
        stream,
        {
            mimeType:mime,

            videoBitsPerSecond:18000
        }
    );


    recorder.ondataavailable = (event) => {

        if(event.data.size > 0){

            chunks.push(event.data);

        }

    };


    const stopped = new Promise((resolve) => {

        recorder.onstop = resolve;

    });


    recorder.start();

    sourceVideo.currentTime = 0;

    await sourceVideo.play();


    const duration =
        Math.min(
            sourceVideo.duration || 5,
            10
        );

    const start =
        performance.now();


    return new Promise(async (resolve) => {

        async function render(){

            if(
                sourceVideo.ended ||
                sourceVideo.currentTime >= duration
            ){

                sourceVideo.pause();

                recorder.stop();

                await stopped;

                const blob = new Blob(
                    chunks,
                    {
                        type:"video/webm"
                    }
                );

                resolve(blob);

                return;

            }


            await processFrame();


            const elapsed =
                performance.now() - start;

            const percent =
                Math.min(
                    100,
                    (sourceVideo.currentTime / duration) * 100
                );

            setStatus(
                "جاري إزالة الخلفية وتحسين الفيديو...",
                percent
            );


            requestAnimationFrame(render);

        }

        render();

    });

}


/* =========================
   محاولة ضغط إضافية
========================= */

async function createFinalVideo(){

    let blob = await recordVideo();

    /*
       إذا تجاوز 64KB:
       نحاول إعادة التسجيل بإعدادات أصغر.
       لأن MediaRecorder لا يسمح بتعديل bitrate
       أثناء التسجيل، نقوم بمحاولات منفصلة.
    */

    if(blob.size <= 64 * 1024){

        return blob;

    }


    setStatus(
        "الحجم أكبر من 64KB، جاري ضغطه...",
        100
    );


    /*
       إعادة تسجيل بإعدادات أخف
    */

    const mime = getMimeType();

    const stream = canvas.captureStream(5);

    const chunks = [];

    const recorder = new MediaRecorder(
        stream,
        {
            mimeType:mime,
            videoBitsPerSecond:7000
        }
    );

    recorder.ondataavailable = e => {

        if(e.data.size > 0){

            chunks.push(e.data);

        }

    };


    const stopped = new Promise(resolve => {

        recorder.onstop = resolve;

    });


    recorder.start();

    sourceVideo.currentTime = 0;

    await sourceVideo.play();


    const duration =
        Math.min(
            sourceVideo.duration || 5,
            6
        );


    return new Promise(resolve => {

        async function loop(){

            if(
                sourceVideo.ended ||
                sourceVideo.currentTime >= duration
            ){

                sourceVideo.pause();

                recorder.stop();

                await stopped;

                const newBlob =
                    new Blob(
                        chunks,
                        {
                            type:"video/webm"
                        }
                    );

                resolve(newBlob);

                return;

            }


            await processFrame();

            setStatus(
                "ضغط الفيديو للوصول إلى أقل من 64KB...",
                (sourceVideo.currentTime / duration) * 100
            );

            requestAnimationFrame(loop);

        }

        loop();

    });

}


/* =========================
   رفع الفيديو
========================= */

videoInput.addEventListener(
    "change",
    async function(){

        const file = this.files[0];

        if(!file){
            return;
        }

        hideError();

        preview.style.display = "none";

        finalBlob = null;

        if(finalURL){

            URL.revokeObjectURL(finalURL);

        }


        try{

            setStatus(
                "جاري تحميل الفيديو...",
                5
            );


            const url =
                URL.createObjectURL(file);

            sourceVideo.src = url;


            await new Promise((resolve,reject) => {

                sourceVideo.onloadedmetadata =
                    resolve;

                sourceVideo.onerror =
                    reject;

            });


            /*
               نحدد مدة الفيديو.
               لأن 64KB مع فيديو طويل جدًا
               سيؤدي إلى جودة شديدة الانخفاض.
            */

            if(sourceVideo.duration > 10){

                showError(
                    "الفيديو أطول من 10 ثوانٍ. سيتم استخدام أول 10 ثوانٍ حتى نحافظ على جودة وحجم مناسبين."
                );

            }


            setStatus(
                "جاري تجهيز الذكاء الاصطناعي...",
                10
            );


            await new Promise(r => setTimeout(r,500));


            setStatus(
                "جاري إزالة الخلفية...",
                20
            );


            finalBlob =
                await createFinalVideo();


            if(!finalBlob){

                throw new Error(
                    "تعذر إنشاء الفيديو."
                );

            }


            /*
               التحقق من الحجم
            */

            const maxSize =
                64 * 1024;


            finalURL =
                URL.createObjectURL(finalBlob);


            resultVideo.src =
                finalURL;


            resultVideo.load();


            fileSize.textContent =
                formatBytes(finalBlob.size);


            preview.style.display =
                "block";


            if(finalBlob.size > maxSize){

                showError(
                    "تم إنشاء الفيديو، لكن المتصفح لم يستطع ضغطه إلى أقل من 64KB مع الحفاظ على الفيديو. الحجم الحالي: " +
                    formatBytes(finalBlob.size)
                );

            }else{

                setStatus(
                    "تم الانتهاء بنجاح ✓",
                    100
                );

            }


        }catch(error){

            console.error(error);

            showError(
                "حدث خطأ أثناء معالجة الفيديو: " +
                error.message
            );

            statusBox.style.display =
                "none";

        }

    }
);


/* =========================
   التحميل
========================= */

downloadBtn.addEventListener(
    "click",
    function(){

        if(!finalBlob){

            return;

        }


        const url =
            URL.createObjectURL(finalBlob);


        const a =
            document.createElement("a");


        a.href = url;

        a.download =
            "SZ-Video-100x100.webm";


        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(() => {

            URL.revokeObjectURL(url);

        },1000);

    }
);

</script>

</body>
</html>
