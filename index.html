canvas,

<body>

<div class="container">

<div class="card">

        SZ <span>VIDEO CLEANER</span>
    </div>

    <div class="subtitle">

    </div>

        </div>

                id="resultVideo"

            <div class="info-box">

                <div class="info-label">

                </div>

                </div>

            </div>

                <div class="info-label">

                <div class="info-label">

</div>


<video
    id="sourceVideo"
    muted
    playsinline
></video>


<canvas
    id="workCanvas"
    width="200"
    height="200"
></canvas>


<canvas
    id="outputCanvas"
    width="100"
    height="100"
></canvas>


<script>

/* =========================================
   العناصر
========================================= */

const videoInput =
    document.getElementById("videoInput");

const sourceVideo =
    document.getElementById("sourceVideo");

const workCanvas =
    document.getElementById("workCanvas");

const outputCanvas =
    document.getElementById("outputCanvas");

const workCtx =
    workCanvas.getContext("2d", {
        alpha:true
    });

const outputCtx =
    outputCanvas.getContext("2d", {
        alpha:true
    });

const resultVideo =
    document.getElementById("resultVideo");

const status =
    document.getElementById("status");

const statusText =
    document.getElementById("statusText");

const progressBar =
    document.getElementById("progressBar");

const preview =
    document.getElementById("preview");

const errorBox =
    document.getElementById("error");

const fileSize =
    document.getElementById("fileSize");

const downloadBtn =
    document.getElementById("downloadBtn");


let finalBlob = null;

let finalURL = null;

let maskCanvas =
    document.createElement("canvas");

let maskCtx =
    maskCanvas.getContext("2d", {
        willReadFrequently:false
    });


/* =========================================
   إعداد MediaPipe
========================================= */

if(
    typeof SelfieSegmentation ===
    "undefined"
){

    throw new Error(
        "تعذر تحميل محرك إزالة الخلفية."
    );

}


const segmentation =
    new SelfieSegmentation({

        locateFile:function(file){

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/selfie_segmentation/" +
                file
            );

        }

    });


segmentation.setOptions({

    modelSelection:1

});


/* =========================================
   تحديث الحالة
========================================= */

function setStatus(
    text,
    percent
){

    status.style.display =
        "block";

    statusText.textContent =
        text;

    progressBar.style.width =
        Math.max(
            0,
            Math.min(
                100,
                percent
            )
        ) + "%";

}


/* =========================================
   الأخطاء
========================================= */

function showError(text){

    errorBox.style.display =
        "block";

    errorBox.textContent =
        text;

}

function hideError(){

    errorBox.style.display =
        "none";

}


/* =========================================
   حجم الملف
========================================= */

function formatSize(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }

    return (
        bytes / 1024
    ).toFixed(2) + " KB";

}


/* =========================================
   MIME
========================================= */

function getMimeType(){

    const list = [

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp8",

        "video/webm"

    ];


    for(
        const type of list
    ){

        if(
            MediaRecorder
                .isTypeSupported(type)
        ){

            return type;

        }

    }


    return null;

}


/* =========================================
   تجهيز الـCanvas
========================================= */

function drawSource(){

    const w =
        sourceVideo.videoWidth;

    const h =
        sourceVideo.videoHeight;


    if(!w || !h){

        return;

    }


    /*
       نأخذ مربعًا من منتصف الفيديو.
       ثم نكبره إلى 200×200 قبل إزالة الخلفية.
    */

    const size =
        Math.min(w,h);


    const sx =
        (w - size) / 2;

    const sy =
        (h - size) / 2;


    workCtx.clearRect(
        0,
        0,
        200,
        200
    );


    workCtx.drawImage(

        sourceVideo,

        sx,
        sy,
        size,
        size,

        0,
        0,
        200,
        200

    );

}


/* =========================================
   إزالة الخلفية من الفريم
========================================= */

async function processFrame(){

    drawSource();


    /*
       MediaPipe يعالج الفريم
    */

    let result = null;


    const handler =
        function(results){

            result = results;

        };


    /*
       MediaPipe يسمح بتغيير callback.
       نحفظ القديم.
    */

    const oldCallback =
        segmentation.onResults;


    let received = false;


    const promise =
        new Promise(
            resolve => {

                segmentation.onResults =
                    function(results){

                        received = true;

                        resolve(results);

                    };

            }
        );


    await segmentation.send({

        image:workCanvas

    });


    const results =
        await promise;


    /*
       إعادة callback الأساسي
    */

    segmentation.onResults =
        oldCallback;


    if(
        !results ||
        !results.segmentationMask
    ){

        throw new Error(
            "تعذر اكتشاف الشخصية في الفيديو."
        );

    }


    /*
       رسم الفيديو
    */

    outputCtx.clearRect(
        0,
        0,
        100,
        100
    );


    outputCtx.drawImage(

        workCanvas,

        0,
        0,
        100,
        100

    );


    /*
       تجهيز الماسك
    */

    maskCanvas.width = 100;
    maskCanvas.height = 100;


    maskCtx.clearRect(
        0,
        0,
        100,
        100
    );


    maskCtx.drawImage(

        results.segmentationMask,

        0,
        0,
        100,
        100

    );


    /*
       تطبيق الشفافية
    */

    outputCtx.globalCompositeOperation =
        "destination-in";


    outputCtx.drawImage(

        maskCanvas,

        0,
        0,
        100,
        100

    );


    outputCtx.globalCompositeOperation =
        "source-over";

}


/* =========================================
   انتظار الفيديو
========================================= */

function waitForEvent(
    element,
    event
){

    return new Promise(
        resolve => {

            element.addEventListener(
                event,
                resolve,
                {
                    once:true
                }
            );

        }
    );

}


/* =========================================
   تسجيل WebM
========================================= */

async function recordVideo(
    bitrate,
    fps
){

    const mime =
        getMimeType();


    if(!mime){

        throw new Error(
            "هذا المتصفح لا يدعم WebM."
        );

    }


    const stream =
        outputCanvas.captureStream(fps);


    const recorder =
        new MediaRecorder(
            stream,
            {
                mimeType:mime,

                videoBitsPerSecond:
                    Math.floor(bitrate)
            }
        );


    const chunks = [];


    recorder.ondataavailable =
        function(event){

            if(
                event.data &&
                event.data.size > 0
            ){

                chunks.push(
                    event.data
                );

            }

        };


    const stopped =
        new Promise(
            resolve => {

                recorder.onstop =
                    resolve;

            }
        );


    recorder.start(250);


    sourceVideo.currentTime = 0;


    await waitForEvent(
        sourceVideo,
        "seeked"
    );


    await sourceVideo.play();


    const duration =
        sourceVideo.duration;


    const start =
        performance.now();


    /*
       حلقة معالجة الفريمات
    */

    while(
        sourceVideo.currentTime <
        duration
    ){

        await processFrame();


        /*
           نعطي الـCanvas وقتًا
           لالتقاط الفريم
        */

        await new Promise(
            resolve =>
                requestAnimationFrame(
                    resolve
                )
        );


        const progress =
            sourceVideo.currentTime /
            duration *
            100;


        setStatus(

            "جاري معالجة الفيديو...",

            progress

        );


        /*
           حماية من التعليق
        */

        if(
            performance.now() -
            start >
            120000
        ){

            recorder.stop();

            sourceVideo.pause();

            throw new Error(
                "الفيديو طويل جدًا للمعالجة على هذا الجهاز."
            );

        }

    }


    sourceVideo.pause();


    /*
       نعطي MediaRecorder
       فرصة لالتقاط آخر فريم
    */

    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                150
            )
    );


    recorder.stop();


    await stopped;


    stream.getTracks()
        .forEach(
            track =>
                track.stop()
        );


    return new Blob(
        chunks,
        {
            type:"video/webm"
        }
    );

}


/* =========================================
   إضافة Padding إلى 64KB
========================================= */

function makeExactly64KB(blob){

    const TARGET =
        64 * 1024;


    /*
       إذا كان أكبر،
       لا نستطيع إضافة Padding.
    */

    if(blob.size > TARGET){

        return null;

    }


    if(blob.size === TARGET){

        return blob;

    }


    const extra =
        new Uint8Array(
            TARGET - blob.size
        );


    return new Blob(
        [
            blob,
            extra
        ],
        {
            type:"video/webm"
        }
    );

}


/* =========================================
   إنشاء أفضل نسخة تحت 64KB
========================================= */

async function createVideo(){

    const duration =
        sourceVideo.duration;


    const LIMIT =
        64 * 1024;


    /*
       نترك مساحة بسيطة للـContainer.
    */

    const targetBytes =
        62 * 1024;


    /*
       نحسب Bitrate مبدئي عالي نسبيًا.
    */

    let bitrate =
        (
            targetBytes *
            8
        ) /
        Math.max(
            duration,
            .5
        );


    /*
       لا نبدأ بضغط سيئ.
    */

    bitrate =
        Math.max(
            12000,
            bitrate
        );


    bitrate =
        Math.min(
            400000,
            bitrate
        );


    /*
       نحاول عدة مرات.
    */

    for(
        let attempt = 0;
        attempt < 10;
        attempt++
    ){

        setStatus(

            "جاري التصدير بجودة عالية...",

            5 + attempt * 4

        );


        /*
           في البداية 24FPS.
        */

        let fps = 24;


        /*
           فقط إذا احتجنا ضغطًا شديدًا،
           نستخدم 20 ثم 15.
        */

        if(
            bitrate < 30000
        ){

            fps = 20;

        }

        if(
            bitrate < 15000
        ){

            fps = 15;

        }


        const blob =
            await recordVideo(
                bitrate,
                fps
            );


        /*
           إذا دخلنا تحت الحد
        */

        if(
            blob.size <=
            LIMIT
        ){

            return makeExactly64KB(
                blob
            );

        }


        /*
           نحسب نسبة التصغير
        */

        const ratio =
            targetBytes /
            blob.size;


        /*
           نقلل الـBitrate
           تدريجيًا وليس بشكل مفاجئ.
        */

        bitrate =
            bitrate *
            ratio *
            0.94;


        bitrate =
            Math.max(
                4500,
                bitrate
            );

    }


    /*
       محاولة أخيرة بأقل إعداد
    */

    setStatus(
        "جاري محاولة الوصول إلى 64KB...",
        90
    );


    const last =
        await recordVideo(
            4500,
            12
        );


    if(
        last.size <= LIMIT
    ){

        return makeExactly64KB(
            last
        );

    }


    throw new Error(
        "لم يمكن ضغط هذا الفيديو إلى 64KB مع إعدادات WebM المتاحة في المتصفح."
    );

}


/* =========================================
   رفع الفيديو
========================================= */

videoInput.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];


        if(!file){

            return;

        }


        hideError();

        preview.style.display =
            "none";


        finalBlob = null;


        if(finalURL){

            URL.revokeObjectURL(
                finalURL
            );

            finalURL = null;

        }


        try{

            setStatus(
                "جاري قراءة الفيديو...",
                3
            );


            const url =
                URL.createObjectURL(file);


            sourceVideo.src =
                url;


            /*
               انتظار البيانات
            */

            await new Promise(
                (resolve,reject)=>{

                    const loaded =
                        function(){

                            resolve();

                        };


                    const failed =
                        function(){

                            reject(
                                new Error(
                                    "تعذر قراءة الفيديو."
                                )
                            );

                        };


                    sourceVideo.addEventListener(
                        "loadedmetadata",
                        loaded,
                        {once:true}
                    );


                    sourceVideo.addEventListener(
                        "error",
                        failed,
                        {once:true}
                    );

                }
            );


            if(
                !sourceVideo.videoWidth ||
                !sourceVideo.videoHeight
            ){

                throw new Error(
                    "أبعاد الفيديو غير صالحة."
                );

            }


            setStatus(
                "جاري تشغيل محرك إزالة الخلفية...",
                8
            );


            /*
               تحميل أول فريم
            */

            sourceVideo.currentTime = 0;


            await new Promise(
                resolve => {

                    if(
                        sourceVideo.readyState >= 2
                    ){

                        resolve();

                    }else{

                        sourceVideo.addEventListener(
                            "loadeddata",
                            resolve,
                            {once:true}
                        );

                    }

                }
            );


            /*
               اختبار إزالة الخلفية
            */

            await processFrame();


            setStatus(
                "تم اكتشاف الشخصية ✓",
                12
            );


            /*
               إنشاء WebM
            */

            finalBlob =
                await createVideo();


            if(
                !finalBlob
            ){

                throw new Error(
                    "فشل إنشاء الملف."
                );

            }


            /*
               تأكيد 64KB
            */

            if(
                finalBlob.size !==
                64 * 1024
            ){

                const exact =
                    makeExactly64KB(
                        finalBlob
                    );


                if(!exact){

                    throw new Error(
                        "الملف تجاوز 64KB."
                    );

                }


                finalBlob =
                    exact;

            }


            /*
               معاينة
            */

            finalURL =
                URL.createObjectURL(
                    finalBlob
                );


            resultVideo.src =
                finalURL;


            resultVideo.load();


            fileSize.textContent =
                formatSize(
                    finalBlob.size
                );


            preview.style.display =
                "block";


            setStatus(
                "تم الانتهاء بنجاح ✓",
                100
            );


            /*
               تشغيل المعاينة
            */

            resultVideo
                .play()
                .catch(
                    ()=>{}
                );


        }catch(error){

            console.error(
                error
            );


            showError(
                error.message ||
                "حدث خطأ غير معروف."
            );


            status.style.display =
                "none";

        }

    }
);


/* =========================================
   تحميل
========================================= */

downloadBtn.addEventListener(
    "click",
    function(){

        if(!finalBlob){

            return;

        }


        const url =
            URL.createObjectURL(
                finalBlob
            );


        const a =
            document.createElement("a");


        a.href = url;

        a.download =
            "SZ-100x100-64KB.webm";


        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(
            ()=>{
                URL.revokeObjectURL(
                    url
                );
            },
            1500
        );

    }
);

</script>
