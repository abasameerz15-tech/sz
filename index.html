<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SZ Video Cleaner</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:
        Arial,
        Tahoma,
        sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 50% 0%,
            #302052 0%,
            #111019 38%,
            #07070a 100%
        );

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:18px;
}

.container{
    width:100%;
    max-width:520px;
}

.card{
    background:rgba(17,17,25,.88);

    border:1px solid rgba(255,255,255,.08);

    border-radius:28px;

    padding:24px;

    box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.04);

    backdrop-filter:blur(20px);
}

.logo{
    text-align:center;

    font-size:30px;

    font-weight:900;

    letter-spacing:.5px;
}

.logo span{
    color:#9b6cff;
}

.subtitle{
    text-align:center;

    color:#898896;

    font-size:12px;

    margin-top:7px;
    margin-bottom:22px;
}

.upload{
    min-height:175px;

    border:2px dashed rgba(153,104,255,.42);

    border-radius:22px;

    background:rgba(153,104,255,.045);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    transition:.2s;
}

.upload:hover{
    border-color:#9d70ff;

    background:rgba(153,104,255,.09);

    transform:translateY(-2px);
}

.upload-icon{
    width:64px;
    height:64px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #a16cff,
            #613bc9
        );

    font-size:30px;

    box-shadow:
        0 12px 35px rgba(119,72,230,.3);

    margin-bottom:13px;
}

.upload-title{
    font-size:16px;
    font-weight:bold;
}

.upload-info{
    color:#777582;
    font-size:11px;
    margin-top:6px;
}

input{
    display:none;
}

.status{
    display:none;

    margin-top:18px;

    padding:14px;

    border-radius:17px;

    background:rgba(255,255,255,.035);
}

.status-title{
    font-size:13px;

    margin-bottom:10px;

    color:#dddde5;
}

.progress{
    width:100%;
    height:7px;

    border-radius:20px;

    background:#25242f;

    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #7245ef,
            #b08aff
        );

    transition:width .15s;
}

.error{
    display:none;

    margin-top:15px;

    padding:13px;

    border-radius:15px;

    background:rgba(255,60,80,.08);

    border:1px solid rgba(255,60,80,.15);

    color:#ff9da8;

    font-size:12px;

    line-height:1.6;
}

.preview{
    display:none;

    margin-top:20px;
}

.preview-title{
    font-size:14px;

    font-weight:bold;

    margin-bottom:10px;
}

.video-box{
    width:100%;

    min-height:270px;

    border-radius:20px;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    background-color:#171720;

    background-image:
        linear-gradient(45deg,#292934 25%,transparent 25%),
        linear-gradient(-45deg,#292934 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#292934 75%),
        linear-gradient(-45deg,transparent 75%,#292934 75%);

    background-size:26px 26px;

    background-position:
        0 0,
        0 13px,
        13px -13px,
        -13px 0;
}

#resultVideo{
    width:100%;

    max-width:360px;

    max-height:360px;

    object-fit:contain;
}

.info{
    display:flex;

    gap:8px;

    margin-top:10px;
}

.info-box{
    flex:1;

    background:rgba(255,255,255,.04);

    border-radius:13px;

    padding:10px;

    text-align:center;
}

.info-label{
    color:#777582;

    font-size:10px;
}

.info-value{
    margin-top:4px;

    font-size:12px;

    font-weight:bold;
}

.download{
    width:100%;

    border:0;

    border-radius:16px;

    padding:15px;

    margin-top:13px;

    background:
        linear-gradient(
            135deg,
            #9b6cff,
            #6842d5
        );

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 12px 30px rgba(105,65,220,.25);

    transition:.2s;
}

.download:hover{
    filter:brightness(1.08);

    transform:translateY(-2px);
}

.download:active{
    transform:scale(.98);
}

.note{
    text-align:center;

    color:#5f5e69;

    font-size:10px;

    line-height:1.6;

    margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

    <div class="logo">
        SZ <span>VIDEO CLEANER</span>
    </div>

    <div class="subtitle">
        إزالة الخلفية وتحويل الفيديو إلى WebM شفاف
    </div>

    <label class="upload" for="videoInput">

        <div class="upload-icon">
            ↑
        </div>

        <div class="upload-title">
            اضغط لرفع الفيديو
        </div>

        <div class="upload-info">
            MP4 / MOV / WebM
        </div>

    </label>

    <input
        id="videoInput"
        type="file"
        accept="video/*"
    >

    <div class="status" id="status">

        <div
            class="status-title"
            id="statusText"
        >
            جاري التجهيز...
        </div>

        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>

    </div>

    <div
        class="error"
        id="error"
    ></div>

    <div
        class="preview"
        id="preview"
    >

        <div class="preview-title">
            النتيجة النهائية
        </div>

        <div class="video-box">

            <video
                id="resultVideo"
                controls
                loop
                playsinline
            ></video>

        </div>

        <div class="info">

            <div class="info-box">

                <div class="info-label">
                    المقاس
                </div>

                <div class="info-value">
                    100×100
                </div>

            </div>

            <div class="info-box">

                <div class="info-label">
                    الصيغة
                </div>

                <div class="info-value">
                    WebM
                </div>

            </div>

            <div class="info-box">

                <div class="info-label">
                    الحجم
                </div>

                <div
                    class="info-value"
                    id="fileSize"
                >
                    --
                </div>

            </div>

        </div>

        <button
            class="download"
            id="downloadBtn"
        >
            تحميل WebM
        </button>

    </div>

    <div class="note">
        تتم معالجة الفيديو داخل جهازك.
        الحد النهائي للملف 64KB.
    </div>

</div>

</div>


<video
    id="sourceVideo"
    muted
    playsinline
    style="display:none"
></video>

<!--
    نستخدم 200×200 أثناء المعالجة
    ثم نصدر 100×100
    لتحسين حواف الشخصية
-->
<canvas
    id="sourceCanvas"
    width="200"
    height="200"
    style="display:none"
></canvas>

<canvas
    id="outputCanvas"
    width="100"
    height="100"
    style="display:none"
></canvas>


<script>

/* =====================================
   العناصر
===================================== */

const input =
    document.getElementById("videoInput");

const sourceVideo =
    document.getElementById("sourceVideo");

const sourceCanvas =
    document.getElementById("sourceCanvas");

const outputCanvas =
    document.getElementById("outputCanvas");

const sourceCtx =
    sourceCanvas.getContext("2d", {
        alpha:true
    });

const outputCtx =
    outputCanvas.getContext("2d", {
        alpha:true
    });

const resultVideo =
    document.getElementById("resultVideo");

const status =
    document.getElementById("status");

const statusText =
    document.getElementById("statusText");

const progressBar =
    document.getElementById("progressBar");

const preview =
    document.getElementById("preview");

const errorBox =
    document.getElementById("error");

const fileSize =
    document.getElementById("fileSize");

const downloadBtn =
    document.getElementById("downloadBtn");


let finalBlob = null;

let finalURL = null;

let currentMask = null;


/* =====================================
   MediaPipe
===================================== */

const segmentation =
    new SelfieSegmentation({

        locateFile:(file)=>{

            return
            `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;

        }

    });


segmentation.setOptions({

    modelSelection:1

});


/* =====================================
   إعداد نتيجة الماسك
===================================== */

segmentation.onResults(
    function(results){

        currentMask =
            results.segmentationMask;

    }
);


/* =====================================
   الحالة
===================================== */

function setStatus(text,percent){

    status.style.display = "block";

    statusText.textContent = text;

    progressBar.style.width =
        Math.max(
            0,
            Math.min(
                100,
                percent
            )
        ) + "%";

}


/* =====================================
   الخطأ
===================================== */

function showError(text){

    errorBox.style.display = "block";

    errorBox.textContent = text;

}

function hideError(){

    errorBox.style.display = "none";

}


/* =====================================
   حجم الملف
===================================== */

function formatSize(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }

    if(bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(2) + " KB";

    }

    return (
        bytes /
        1024 /
        1024
    ).toFixed(2) + " MB";

}


/* =====================================
   اختيار MIME
===================================== */

function getMime(){

    const types = [

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp8",

        "video/webm"

    ];

    for(
        const type of types
    ){

        if(
            MediaRecorder
            .isTypeSupported(type)
        ){

            return type;

        }

    }

    return null;

}


/* =====================================
   رسم الفيديو بشكل مربع
===================================== */

function drawSource(){

    const w =
        sourceVideo.videoWidth;

    const h =
        sourceVideo.videoHeight;

    const size =
        Math.min(w,h);

    const x =
        (w - size) / 2;

    const y =
        (h - size) / 2;


    sourceCtx.clearRect(
        0,
        0,
        200,
        200
    );


    sourceCtx.drawImage(

        sourceVideo,

        x,
        y,
        size,
        size,

        0,
        0,
        200,
        200

    );

}


/* =====================================
   معالجة الفريم
===================================== */

async function processFrame(){

    drawSource();

    currentMask = null;


    await segmentation.send({

        image:sourceCanvas

    });


    /*
       ننتظر وصول الماسك
    */

    let tries = 0;

    while(
        !currentMask &&
        tries < 20
    ){

        await new Promise(
            r => requestAnimationFrame(r)
        );

        tries++;

    }


    if(!currentMask){

        return;

    }


    /*
       نضع صورة الفيديو
    */

    outputCtx.clearRect(
        0,
        0,
        100,
        100
    );


    outputCtx.drawImage(

        sourceCanvas,

        0,
        0,
        100,
        100

    );


    /*
       الماسك
    */

    const maskCanvas =
        document.createElement("canvas");

    maskCanvas.width = 100;
    maskCanvas.height = 100;

    const maskCtx =
        maskCanvas.getContext("2d");


    maskCtx.drawImage(

        currentMask,

        0,
        0,
        100,
        100

    );


    /*
       إزالة الخلفية
    */

    outputCtx.globalCompositeOperation =
        "destination-in";


    outputCtx.drawImage(

        maskCanvas,

        0,
        0,
        100,
        100

    );


    /*
       إعادة الوضع الطبيعي
    */

    outputCtx.globalCompositeOperation =
        "source-over";

}


/* =====================================
   تسجيل الفيديو
===================================== */

async function recordVideo(
    bitrate,
    fps
){

    const mime =
        getMime();


    if(!mime){

        throw new Error(
            "متصفحك لا يدعم WebM."
        );

    }


    const stream =
        outputCanvas.captureStream(fps);


    const recorder =
        new MediaRecorder(
            stream,
            {

                mimeType:mime,

                videoBitsPerSecond:
                    Math.round(bitrate)

            }
        );


    const chunks = [];


    recorder.ondataavailable =
        function(e){

            if(e.data.size){

                chunks.push(e.data);

            }

        };


    const stopped =
        new Promise(resolve => {

            recorder.onstop =
                resolve;

        });


    recorder.start(100);


    sourceVideo.currentTime = 0;

    await sourceVideo.play();


    const duration =
        sourceVideo.duration;


    const endTime =
        duration;


    let lastTime = -1;


    return new Promise(
        async resolve => {

            async function render(){

                if(
                    sourceVideo.paused ||
                    sourceVideo.ended ||
                    sourceVideo.currentTime >= endTime
                ){

                    sourceVideo.pause();

                    recorder.stop();

                    await stopped;


                    const blob =
                        new Blob(
                            chunks,
                            {
                                type:"video/webm"
                            }
                        );


                    resolve(blob);

                    return;

                }


                /*
                   منع معالجة نفس الفريم
                   أكثر من مرة
                */

                if(
                    sourceVideo.currentTime !==
                    lastTime
                ){

                    lastTime =
                        sourceVideo.currentTime;

                    await processFrame();

                }


                const percent =
                    (
                        sourceVideo.currentTime /
                        duration
                    ) * 100;


                setStatus(

                    "جاري معالجة الفيديو...",

                    percent

                );


                requestAnimationFrame(
                    render
                );

            }


            render();

        }

    );

}


/* =====================================
   تحديد Bitrate مناسب
===================================== */

function calculateBitrate(
    duration
){

    /*
       64KB = 524288 bits

       نترك مساحة بسيطة
       للـWebM container.

       الهدف حوالي 92%
       من المساحة.
    */

    const availableBits =
        64 * 1024 * 8 * 0.92;


    let bitrate =
        availableBits /
        Math.max(
            duration,
            0.5
        );


    /*
       حدود منطقية
    */

    bitrate =
        Math.max(
            8000,
            bitrate
        );


    bitrate =
        Math.min(
            220000,
            bitrate
        );


    return bitrate;

}


/* =====================================
   Padding إلى 64KB
===================================== */

function padTo64KB(blob){

    const target =
        64 * 1024;


    if(blob.size >= target){

        return blob;

    }


    /*
       نضيف Bytes في نهاية الـBlob.

       هذا لا يعيد ضغط الفيديو
       ولا يغير الفريمات.
    */

    const padding =
        new Uint8Array(
            target - blob.size
        );


    return new Blob(

        [
            blob,
            padding

        ],

        {
            type:"video/webm"
        }

    );

}


/* =====================================
   إنشاء النسخة النهائية
===================================== */

async function createFinal(){

    const duration =
        sourceVideo.duration;


    let bitrate =
        calculateBitrate(
            duration
        );


    /*
       محاولات الضغط
    */

    for(
        let attempt = 0;
        attempt < 8;
        attempt++
    ){

        setStatus(

            "جاري إنشاء نسخة عالية الجودة...",

            10 + attempt * 5

        );


        const blob =
            await recordVideo(
                bitrate,
                24
            );


        /*
           ممتاز
        */

        if(
            blob.size <=
            64 * 1024
        ){

            return padTo64KB(blob);

        }


        /*
           إذا أكبر من 64KB
           نقلل الـBitrate تدريجيًا
        */

        const ratio =
            (
                64 * 1024
            ) /
            blob.size;


        bitrate =
            bitrate *
            ratio *
            0.94;


        /*
           لا ننزل إلى Bitrate
           منخفض جدًا بسرعة.
        */

        bitrate =
            Math.max(
                5000,
                bitrate
            );

    }


    /*
       محاولة أخيرة
    */

    const last =
        await recordVideo(
            5000,
            15
        );


    if(
        last.size <=
        64 * 1024
    ){

        return padTo64KB(last);

    }


    throw new Error(
        "الفيديو طويل أو معقد جدًا للوصول إلى 64KB مع الجودة المطلوبة."
    );

}


/* =====================================
   رفع الفيديو
===================================== */

input.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];


        if(!file){

            return;

        }


        hideError();

        preview.style.display =
            "none";


        try{

            setStatus(
                "جاري تحميل الفيديو...",
                3
            );


            if(finalURL){

                URL.revokeObjectURL(
                    finalURL
                );

                finalURL = null;

            }


            finalBlob = null;


            const url =
                URL.createObjectURL(file);


            sourceVideo.src = url;


            await new Promise(
                (resolve,reject)=>{

                    sourceVideo.onloadedmetadata =
                        resolve;

                    sourceVideo.onerror =
                        reject;

                }
            );


            if(
                !sourceVideo.videoWidth ||
                !sourceVideo.videoHeight
            ){

                throw new Error(
                    "تعذر قراءة الفيديو."
                );

            }


            setStatus(
                "جاري تشغيل محرك إزالة الخلفية...",
                8
            );


            /*
               تجهيز أول فريم
            */

            sourceVideo.currentTime = 0;

            await new Promise(
                resolve => {

                    sourceVideo.onseeked =
                        resolve;

                }
            );


            await processFrame();


            setStatus(
                "جاري تحسين الحواف...",
                15
            );


            await new Promise(
                r => setTimeout(r,300)
            );


            /*
               إنشاء الفيديو
            */

            finalBlob =
                await createFinal();


            if(
                finalBlob.size >
                64 * 1024
            ){

                throw new Error(
                    "تعذر الوصول إلى 64KB."
                );

            }


            /*
               تأكيد الحجم
            */

            if(
                finalBlob.size <
                64 * 1024
            ){

                finalBlob =
                    padTo64KB(
                        finalBlob
                    );

            }


            finalURL =
                URL.createObjectURL(
                    finalBlob
                );


            resultVideo.src =
                finalURL;


            resultVideo.load();


            fileSize.textContent =
                formatSize(
                    finalBlob.size
                );


            preview.style.display =
                "block";


            setStatus(
                "تم الانتهاء ✓",
                100
            );


            /*
               تشغيل المعاينة
            */

            resultVideo.play()
                .catch(()=>{});


        }catch(error){

            console.error(error);


            showError(
                error.message ||
                "حدث خطأ أثناء معالجة الفيديو."
            );


            status.style.display =
                "none";

        }

    }
);


/* =====================================
   تحميل
===================================== */

downloadBtn.addEventListener(
    "click",
    function(){

        if(!finalBlob){

            return;

        }


        const url =
            URL.createObjectURL(
                finalBlob
            );


        const a =
            document.createElement("a");


        a.href = url;

        a.download =
            "SZ-100x100-64KB.webm";


        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(
            ()=>{
                URL.revokeObjectURL(url);
            },
            1000
        );

    }
);

</script>

</body>
</html>
