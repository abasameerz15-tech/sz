<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SZ VIDEO CLEANER</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    min-height:100vh;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    background:
        radial-gradient(
            circle at 50% 0%,
            #35205a 0%,
            #15121f 38%,
            #07070b 100%
        );
}

.container{
    width:100%;
    max-width:520px;
}

.card{
    padding:24px;
    border-radius:28px;
    background:rgba(14,14,22,.94);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 30px 90px rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:900;
}

.logo span{
    color:#9b6cff;
}

.subtitle{
    text-align:center;
    color:#888693;
    font-size:12px;
    margin-top:8px;
    margin-bottom:22px;
}

.upload{
    min-height:175px;
    border:2px dashed #9868ff;
    border-radius:22px;
    background:rgba(140,90,255,.05);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:.2s;
}

.upload:active{
    transform:scale(.98);
}

.upload-icon{
    width:64px;
    height:64px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    background:linear-gradient(135deg,#a36bff,#6339ce);
    box-shadow:0 12px 35px rgba(120,70,240,.3);
    margin-bottom:13px;
}

.upload-title{
    font-size:17px;
    font-weight:bold;
}

.upload-info{
    color:#777582;
    font-size:11px;
    margin-top:7px;
}

#videoInput{
    display:none;
}

.status{
    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:17px;
    background:rgba(255,255,255,.035);
}

.status-text{
    color:#dddde5;
    font-size:13px;
    margin-bottom:10px;
}

.progress{
    width:100%;
    height:7px;
    border-radius:20px;
    overflow:hidden;
    background:#272631;
}

.progress-bar{
    width:0%;
    height:100%;
    border-radius:20px;
    background:linear-gradient(90deg,#7040e8,#b28cff);
    transition:width .15s;
}

.error{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:15px;
    background:rgba(255,50,70,.08);
    border:1px solid rgba(255,50,70,.15);
    color:#ff9da8;
    font-size:12px;
    line-height:1.6;
}

.preview{
    display:none;
    margin-top:20px;
}

.preview-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:10px;
}

.video-box{
    width:100%;
    min-height:270px;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;

    background-color:#181820;

    background-image:
        linear-gradient(45deg,#292934 25%,transparent 25%),
        linear-gradient(-45deg,#292934 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#292934 75%),
        linear-gradient(-45deg,transparent 75%,#292934 75%);

    background-size:26px 26px;

    background-position:
        0 0,
        0 13px,
        13px -13px,
        -13px 0;
}

#resultVideo{
    width:100%;
    max-width:350px;
    max-height:350px;
    object-fit:contain;
}

.info{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.info-box{
    flex:1;
    padding:10px;
    border-radius:13px;
    text-align:center;
    background:rgba(255,255,255,.04);
}

.info-label{
    color:#777582;
    font-size:10px;
}

.info-value{
    margin-top:4px;
    font-size:12px;
    font-weight:bold;
}

.download{
    width:100%;
    border:0;
    border-radius:16px;
    padding:15px;
    margin-top:13px;

    background:linear-gradient(135deg,#9b6cff,#6842d5);

    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.download:active{
    transform:scale(.98);
}

.note{
    text-align:center;
    color:#62606c;
    font-size:10px;
    line-height:1.6;
    margin-top:15px;
}

#sourceVideo,
canvas{
    display:none;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

    <div class="logo">
        SZ <span>VIDEO CLEANER</span>
    </div>

    <div class="subtitle">
        إزالة الخلفية وتحويل الفيديو إلى WebM شفاف
    </div>

    <label class="upload" for="videoInput">

        <div class="upload-icon">
            ↑
        </div>

        <div class="upload-title">
            اضغط لرفع الفيديو
        </div>

        <div class="upload-info">
            MP4 / MOV / WebM
        </div>

    </label>

    <input
        id="videoInput"
        type="file"
        accept="video/*"
    >

    <div class="status" id="status">

        <div class="status-text" id="statusText">
            جاري التجهيز...
        </div>

        <div class="progress">
            <div
                class="progress-bar"
                id="progressBar"
            ></div>
        </div>

    </div>

    <div class="error" id="error"></div>

    <div class="preview" id="preview">

        <div class="preview-title">
            النتيجة النهائية
        </div>

        <div class="video-box">

            <video
                id="resultVideo"
                controls
                loop
                playsinline
            ></video>

        </div>

        <div class="info">

            <div class="info-box">
                <div class="info-label">المقاس</div>
                <div class="info-value">100×100</div>
            </div>

            <div class="info-box">
                <div class="info-label">الصيغة</div>
                <div class="info-value">WebM</div>
            </div>

            <div class="info-box">
                <div class="info-label">الحجم</div>
                <div
                    class="info-value"
                    id="fileSize"
                >
                    --
                </div>
            </div>

        </div>

        <button
            class="download"
            id="downloadBtn"
        >
            تحميل WebM
        </button>

    </div>

    <div class="note">
        المعالجة تتم داخل جهازك • الحد الأقصى 64KB
    </div>

</div>

</div>


<video
    id="sourceVideo"
    muted
    playsinline
></video>

<canvas
    id="workCanvas"
    width="200"
    height="200"
></canvas>

<canvas
    id="outputCanvas"
    width="100"
    height="100"
></canvas>


<script>

/* =====================================
   العناصر
===================================== */

const videoInput =
    document.getElementById("videoInput");

const sourceVideo =
    document.getElementById("sourceVideo");

const workCanvas =
    document.getElementById("workCanvas");

const outputCanvas =
    document.getElementById("outputCanvas");

const workCtx =
    workCanvas.getContext("2d");

const outputCtx =
    outputCanvas.getContext("2d");

const resultVideo =
    document.getElementById("resultVideo");

const status =
    document.getElementById("status");

const statusText =
    document.getElementById("statusText");

const progressBar =
    document.getElementById("progressBar");

const preview =
    document.getElementById("preview");

const errorBox =
    document.getElementById("error");

const fileSize =
    document.getElementById("fileSize");

const downloadBtn =
    document.getElementById("downloadBtn");


let finalBlob = null;
let finalURL = null;


/* =====================================
   MediaPipe - Callback ثابت
===================================== */

let segmentationResult = null;
let segmentationWaiting = null;


/*
   ننشئ MediaPipe مرة واحدة فقط
*/

const segmentation =
    new SelfieSegmentation({

        locateFile:function(file){

            return "https://cdn.jsdelivr.net/npm/" +
                   "@mediapipe/selfie_segmentation/" +
                   file;

        }

    });


segmentation.setOptions({

    modelSelection:1

});


/*
   هذا الـCallback يبقى ثابت طوال البرنامج
*/

segmentation.onResults(
    function(results){

        segmentationResult =
            results;

        if(segmentationWaiting){

            segmentationWaiting(
                results
            );

            segmentationWaiting =
                null;

        }

    }
);


/* =====================================
   انتظار نتيجة MediaPipe
===================================== */

function waitForSegmentation(){

    return new Promise(
        function(resolve){

            segmentationWaiting =
                resolve;

        }
    );

}


/* =====================================
   الحالة
===================================== */

function setStatus(
    text,
    percent
){

    status.style.display =
        "block";

    statusText.textContent =
        text;

    progressBar.style.width =
        Math.max(
            0,
            Math.min(
                100,
                percent
            )
        ) + "%";

}


/* =====================================
   الخطأ
===================================== */

function showError(text){

    errorBox.style.display =
        "block";

    errorBox.textContent =
        text;

}

function hideError(){

    errorBox.style.display =
        "none";

}


/* =====================================
   حجم الملف
===================================== */

function formatSize(bytes){

    return (
        bytes / 1024
    ).toFixed(2) + " KB";

}


/* =====================================
   MIME
===================================== */

function getMimeType(){

    const types = [

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp8",

        "video/webm"

    ];


    for(
        const type of types
    ){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            return type;

        }

    }


    return null;

}


/* =====================================
   رسم الفيديو
===================================== */

function drawVideo(){

    const w =
        sourceVideo.videoWidth;

    const h =
        sourceVideo.videoHeight;


    if(!w || !h){

        throw new Error(
            "تعذر قراءة أبعاد الفيديو."
        );

    }


    const size =
        Math.min(
            w,
            h
        );


    const sx =
        (w - size) / 2;

    const sy =
        (h - size) / 2;


    workCtx.clearRect(
        0,
        0,
        200,
        200
    );


    /*
       جودة عالية قبل التصغير
    */

    workCtx.imageSmoothingEnabled =
        true;

    workCtx.imageSmoothingQuality =
        "high";


    workCtx.drawImage(

        sourceVideo,

        sx,
        sy,
        size,
        size,

        0,
        0,
        200,
        200

    );

}


/* =====================================
   معالجة فريم واحد
===================================== */

async function processFrame(){

    drawVideo();


    segmentationResult =
        null;


    /*
       نرسل الفريم
    */

    const resultPromise =
        waitForSegmentation();


    await segmentation.send({

        image:workCanvas

    });


    /*
       ننتظر النتيجة
    */

    const results =
        await resultPromise;


    if(
        !results ||
        !results.segmentationMask
    ){

        throw new Error(
            "لم يتم اكتشاف الشخصية."
        );

    }


    /*
       رسم الصورة
    */

    outputCtx.clearRect(
        0,
        0,
        100,
        100
    );


    outputCtx.imageSmoothingEnabled =
        true;

    outputCtx.imageSmoothingQuality =
        "high";


    outputCtx.drawImage(

        workCanvas,

        0,
        0,
        100,
        100

    );


    /*
       تطبيق الماسك
    */

    outputCtx.globalCompositeOperation =
        "destination-in";


    outputCtx.drawImage(

        results.segmentationMask,

        0,
        0,
        100,
        100

    );


    outputCtx.globalCompositeOperation =
        "source-over";

}


/* =====================================
   تسجيل الفيديو
===================================== */

async function recordVideo(
    bitrate,
    fps
){

    const mime =
        getMimeType();


    if(!mime){

        throw new Error(
            "متصفحك لا يدعم إنشاء WebM."
        );

    }


    const stream =
        outputCanvas.captureStream(
            fps
        );


    const recorder =
        new MediaRecorder(
            stream,
            {

                mimeType:mime,

                videoBitsPerSecond:
                    Math.round(bitrate)

            }
        );


    const chunks = [];


    recorder.ondataavailable =
        function(event){

            if(
                event.data &&
                event.data.size > 0
            ){

                chunks.push(
                    event.data
                );

            }

        };


    const stopped =
        new Promise(
            function(resolve){

                recorder.onstop =
                    resolve;

            }
        );


    recorder.start();


    /*
       نبدأ من البداية
    */

    sourceVideo.currentTime =
        0;


    await new Promise(
        function(resolve){

            if(
                sourceVideo.readyState >= 2
            ){

                resolve();

            }else{

                sourceVideo.addEventListener(
                    "loadeddata",
                    resolve,
                    {once:true}
                );

            }

        }
    );


    await sourceVideo.play();


    const duration =
        sourceVideo.duration;


    const startTime =
        performance.now();


    /*
       معالجة الفريمات
    */

    while(
        sourceVideo.currentTime <
        duration
    ){

        await processFrame();


        /*
           ننتظر الفريم التالي
        */

        await new Promise(
            function(resolve){

                requestAnimationFrame(
                    resolve
                );

            }
        );


        const progress =
            (
                sourceVideo.currentTime /
                duration
            ) * 100;


        setStatus(
            "جاري إزالة الخلفية...",
            progress
        );


        /*
           منع تجميد الهاتف
        */

        if(
            performance.now() -
            startTime >
            180000
        ){

            recorder.stop();

            sourceVideo.pause();

            throw new Error(
                "المعالجة أخذت وقتًا طويلًا جدًا على جهازك."
            );

        }

    }


    sourceVideo.pause();


    await new Promise(
        function(resolve){

            setTimeout(
                resolve,
                250
            );

        }
    );


    recorder.stop();


    await stopped;


    stream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );


    return new Blob(
        chunks,
        {
            type:"video/webm"
        }
    );

}


/* =====================================
   إضافة Padding إلى 64KB
===================================== */

function exact64KB(blob){

    const LIMIT =
        64 * 1024;


    if(
        blob.size >
        LIMIT
    ){

        return null;

    }


    if(
        blob.size ===
        LIMIT
    ){

        return blob;

    }


    /*
       نضيف Bytes في النهاية.
       لا نعيد ضغط الفيديو.
    */

    const padding =
        new Uint8Array(
            LIMIT - blob.size
        );


    return new Blob(
        [
            blob,
            padding
        ],
        {
            type:"video/webm"
        }
    );

}


/* =====================================
   إنشاء أفضل نسخة
===================================== */

async function createFinalVideo(){

    const duration =
        sourceVideo.duration;


    const LIMIT =
        64 * 1024;


    /*
       نترك مساحة للـWebM Header
    */

    const target =
        60 * 1024;


    /*
       Bitrate مبدئي
    */

    let bitrate =
        (
            target *
            8
        ) /
        Math.max(
            duration,
            .5
        );


    /*
       لا نبدأ بجودة سيئة
    */

    bitrate =
        Math.max(
            20000,
            bitrate
        );


    /*
       محاولات تدريجية
    */

    for(
        let attempt = 0;
        attempt < 8;
        attempt++
    ){

        setStatus(
            "جاري إنشاء الفيديو بجودة عالية...",
            5 + attempt * 8
        );


        /*
           نحافظ على 24FPS
        */

        const blob =
            await recordVideo(
                bitrate,
                24
            );


        /*
           وصلنا إلى الحد
        */

        if(
            blob.size <=
            LIMIT
        ){

            return exact64KB(
                blob
            );

        }


        /*
           حساب نسبة الضغط
        */

        const ratio =
            target /
            blob.size;


        /*
           تخفيض تدريجي
        */

        bitrate =
            bitrate *
            ratio *
            .95;


        bitrate =
            Math.max(
                5000,
                bitrate
            );

    }


    /*
       آخر محاولة
    */

    const last =
        await recordVideo(
            5000,
            18
        );


    if(
        last.size <=
        LIMIT
    ){

        return exact64KB(
            last
        );

    }


    throw new Error(
        "الفيديو لا يمكن ضغطه إلى 64KB بهذه الإعدادات."
    );

}


/* =====================================
   رفع الفيديو
===================================== */

videoInput.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];


        if(!file){

            return;

        }


        hideError();

        preview.style.display =
            "none";


        finalBlob = null;


        if(finalURL){

            URL.revokeObjectURL(
                finalURL
            );

            finalURL = null;

        }


        try{

            setStatus(
                "جاري قراءة الفيديو...",
                2
            );


            const url =
                URL.createObjectURL(
                    file
                );


            sourceVideo.src =
                url;


            await new Promise(
                function(resolve,reject){

                    sourceVideo.addEventListener(
                        "loadedmetadata",
                        resolve,
                        {once:true}
                    );

                    sourceVideo.addEventListener(
                        "error",
                        function(){

                            reject(
                                new Error(
                                    "تعذر قراءة الفيديو."
                                )
                            );

                        },
                        {once:true}
                    );

                }
            );


            if(
                !sourceVideo.duration ||
                !sourceVideo.videoWidth
            ){

                throw new Error(
                    "الفيديو غير صالح."
                );

            }


            /*
               لا نعالج أكثر من 10 ثواني
               لأن 64KB للفيديو الطويل
               غير عملي.
            */

            if(
                sourceVideo.duration > 10
            ){

                showError(
                    "الفيديو أطول من 10 ثواني، سيتم استخدام أول 10 ثواني فقط."
                );

            }


            setStatus(
                "جاري تشغيل محرك إزالة الخلفية...",
                8
            );


            /*
               اختبار أول فريم
            */

            sourceVideo.currentTime =
                0;


            await new Promise(
                function(resolve){

                    sourceVideo.addEventListener(
                        "seeked",
                        resolve,
                        {once:true}
                    );

                }
            );


            await processFrame();


            setStatus(
                "تم تشغيل محرك إزالة الخلفية ✓",
                15
            );


            /*
               إنشاء النسخة
            */

            finalBlob =
                await createFinalVideo();


            if(!finalBlob){

                throw new Error(
                    "تعذر إنشاء الملف."
                );

            }


            if(
                finalBlob.size !==
                64 * 1024
            ){

                throw new Error(
                    "تعذر جعل حجم الملف 64KB."
                );

            }


            /*
               المعاينة
            */

            finalURL =
                URL.createObjectURL(
                    finalBlob
                );


            resultVideo.src =
                finalURL;


            resultVideo.load();


            fileSize.textContent =
                formatSize(
                    finalBlob.size
                );


            preview.style.display =
                "block";


            setStatus(
                "تم الانتهاء بنجاح ✓",
                100
            );


        }catch(error){

            console.error(
                error
            );


            status.style.display =
                "none";


            showError(
                error.message ||
                "حدث خطأ أثناء المعالجة."
            );

        }

    }
);


/* =====================================
   التحميل
===================================== */

downloadBtn.addEventListener(
    "click",
    function(){

        if(!finalBlob){

            return;

        }


        const url =
            URL.createObjectURL(
                finalBlob
            );


        const a =
            document.createElement("a");


        a.href =
            url;


        a.download =
            "SZ-VIDEO-64KB.webm";


        document.body.appendChild(a);

        a.click();

        a.remove();


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    url
                );

            },
            1500
        );

    }
);

</script>

</body>
</html>
